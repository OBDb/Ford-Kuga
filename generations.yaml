generations:
  - name: "First Generation"
    start_year: 2008
    end_year: 2013
    description: "The original Ford Kuga was a compact crossover SUV designed primarily for the European market. Built on Ford's C1 platform shared with the Focus and C-MAX, it featured sporty styling that helped differentiate it from more utilitarian competitors. Initially available with a 2.0L Duratorq diesel engine and later a 2.5L Duratec petrol, most models featured an intelligent all-wheel-drive system that could transfer torque between front and rear axles as needed. The interior offered a driver-focused cockpit with higher quality materials than many competitors."

  - name: "Second Generation"
    start_year: 2012
    end_year: 2019
    description: "The second-generation Kuga became a global model as part of Ford's 'One Ford' strategy, sold as the Escape in North America. Built on Ford's Global C platform (derived from C1), it featured more modern styling with improved aerodynamics and a more upscale appearance. Engine options varied by market but typically included EcoBoost petrol engines and Duratorq diesels with improved efficiency. Available technology expanded significantly to include SYNC with MyFord Touch (later SYNC 3), active park assist, and advanced safety features."

  - name: "Third Generation"
    start_year: 2019
    end_year: null
    description: "The current Kuga (continuing as Escape in North America) features a complete redesign with more car-like styling cues and significantly improved aerodynamics. Built on Ford's C2 platform shared with the Focus, it emphasizes improved driving dynamics and efficiency. Engine options vary by market but include EcoBoost petrol engines, EcoBlue diesels, and for the first time, hybrid and plug-in hybrid powertrains. The PHEV variant offers approximately 31 miles of electric-only range from its 14.4 kWh battery."